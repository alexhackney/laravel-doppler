name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    # Windows is informational until it has been green for a release. The suite carries
    # seven ->skipOnWindows() tests, so Windows was clearly considered — but no runner has
    # ever executed it, which means those skips are assumptions rather than facts. Failing
    # the build on an unproven surface would block a release for a platform nobody deploys
    # to; reporting on it turns the assumption into evidence. Drop this once it is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every cell here was verified to resolve and pass locally before being
        # committed. Laravel 12 requires PHP ^8.2; Laravel 13 requires PHP ^8.3.
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Lowest-bound runs, so an under-constrained dependency fails here rather
          # than in somebody's application. One per supported Laravel major: a constraint
          # can be under-specified on the 13 path and perfectly fine on the 12 one.
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            dependency-version: prefer-lowest
            os: ubuntu-latest
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            dependency-version: prefer-lowest
            os: ubuntu-latest
          # The one non-Linux cell. Everything this package does to a file — chmod, chown,
          # flock, atomic rename, POSIX ownership — behaves differently here, and the
          # guards for that have never been executed.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependency-version: prefer-stable
            os: windows-latest
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - laravel: '13.*'
            php: '8.2'

    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, openssl, posix, fileinfo
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        shell: bash
        run: |
          # Static-analysis only, and it requires PHP 8.4 + Pest 5, which this matrix
          # deliberately goes below. Nothing here runs PHPStan, so drop it before resolving.
          composer remove --dev --no-interaction --no-update pestphp/pest-plugin-phpstan
          composer require --no-interaction --no-update \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}"
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Show resolved versions
        shell: bash
        run: composer show --direct

      - name: Run tests
        shell: bash
        run: vendor/bin/pest --ci
